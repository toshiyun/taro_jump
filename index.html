<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>タロジャンプ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="しばいぬのタロ助をタップでジャンプさせる障害物レース">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="タロジャンプ">
<meta name="theme-color" content="#2f9bf0">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Mochiy+Pop+One&display=swap">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="ゲーム画面"></canvas>

  <div id="hud" class="hud" hidden>
    <div class="hud-row">
      <div id="hearts" class="hearts" aria-label="のこりライフ">
        <svg class="heart" viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21s-9.5-5.6-9.5-12A5.3 5.3 0 0 1 12 5.6 5.3 5.3 0 0 1 21.5 9c0 6.4-9.5 12-9.5 12z"/></svg>
        <svg class="heart" viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21s-9.5-5.6-9.5-12A5.3 5.3 0 0 1 12 5.6 5.3 5.3 0 0 1 21.5 9c0 6.4-9.5 12-9.5 12z"/></svg>
        <svg class="heart" viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21s-9.5-5.6-9.5-12A5.3 5.3 0 0 1 12 5.6 5.3 5.3 0 0 1 21.5 9c0 6.4-9.5 12-9.5 12z"/></svg>
      </div>
      <div id="timer" class="timer" aria-label="タイム">0:00.00</div>
      <button id="muteBtn" class="icon-btn" type="button" aria-label="音を消す">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="speaker" d="M4 9h4l5-4v14l-5-4H4z"/><path class="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="cross" d="M16 9l5 6M21 9l-5 6"/></svg>
      </button>
    </div>
    <div class="progress" aria-label="とびこえた数">
      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
        <div id="progressFlag" class="progress-flag">GOAL</div>
      </div>
      <div class="progress-count"><span id="clearedCount">0</span><small id="goalCount">/20</small></div>
    </div>
  </div>

  <div id="jumpMeter" class="jump-meter" hidden aria-hidden="true">
    <span class="pip"></span><span class="pip"></span><span class="pip"></span>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>
  <div id="countdown" class="countdown" aria-live="assertive"></div>

  <section id="titleScreen" class="screen title-screen">
    <header class="title-head">
      <p class="eyebrow">くろしば タロ助の</p>
      <h1 class="logo"><span>タロ</span><span>ジャンプ</span></h1>
    </header>
    <div class="title-foot">
      <ul class="howto" aria-label="あそびかた">
        <li><span class="mini-bars" aria-hidden="true"><i></i></span><span><b>1回</b>タップ</span></li>
        <li><span class="mini-bars" aria-hidden="true"><i></i><i></i></span><span><b>2回</b>タップ</span></li>
        <li><span class="mini-bars" aria-hidden="true"><i></i><i></i><i></i></span><span><b>3回</b>タップ</span></li>
      </ul>
      <p class="rule">バーの本数だけタップしてジャンプ！<br><span id="ruleCounts">20こ飛びこえたらゴール。3回ぶつかるとおしまい。</span></p>
      <button id="startBtn" class="big-btn" type="button">スタート</button>
      <p id="bestTitle" class="best"></p>
    </div>
  </section>

  <section id="resultScreen" class="screen result-screen" hidden>
    <div class="card">
      <p id="resultEyebrow" class="eyebrow">クリアタイム</p>
      <h2 id="resultTitle" class="result-title">ゴール！</h2>
      <p id="resultTime" class="result-time">0:00.00</p>
      <p id="resultBadge" class="result-badge" hidden>ベスト更新！</p>
      <dl class="stats">
        <div><dt>とびこえた</dt><dd id="resultCleared">0</dd></div>
        <div><dt>ぶつかった</dt><dd id="resultHits">0</dd></div>
        <div><dt>ベスト</dt><dd id="resultBest">--</dd></div>
      </dl>
      <button id="retryBtn" class="big-btn" type="button">もう一回</button>
      <button id="homeBtn" class="text-btn" type="button">タイトルへ</button>
    </div>
  </section>

  <section id="pauseScreen" class="screen pause-screen" hidden>
    <div class="card">
      <h2 class="result-title">ひとやすみ</h2>
      <p class="rule">タイムは止まっています</p>
      <button id="resumeBtn" class="big-btn" type="button">つづける</button>
    </div>
  </section>

  <div id="errorScreen" class="screen error-screen" hidden>
    <div class="card">
      <h2 class="result-title">うまく表示できません</h2>
      <p class="rule">このブラウザでは3D表示（WebGL）が使えないようです。iPhoneのSafariで開き直してください。</p>
    </div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
